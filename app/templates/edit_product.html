{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white mb-4">Edit Product</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group mb-3">
            <label for="name" class="text-white">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
        </div>
        <div class="form-group mb-3">
            <label for="model" class="text-white">Model</label>
            <input type="text" class="form-control" id="model" name="model" value="{{ product.model }}">
        </div>
        <div class="form-group mb-3">
            <label for="serial_number" class="text-white">Serial Number</label>
            <input type="text" class="form-control" id="serial_number" name="serial_number" value="{{ product.serial_number }}">
        </div>
        <div class="form-group mb-3">
            <label for="description" class="text-white">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ product.description }}</textarea>
        </div>
        <div class="form-group mb-3">
            <label for="quantity_in_stock" class="text-white">Quantity in Stock</label>
            <input type="number" class="form-control" id="quantity_in_stock" name="quantity_in_stock" value="{{ product.quantity_in_stock }}" required>
        </div>
        <div class="form-group mb-3">
            <label for="price" class="text-white">Price</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price }}" required>
        </div>
        <div class="form-group mb-3">
            <label for="warranty_status" class="text-white">Warranty Status</label>
            <input type="text" class="form-control" id="warranty_status" name="warranty_status" value="{{ product.warranty_status }}">
        </div>
        <div class="form-group mb-3">
            <label for="distributor_info" class="text-white">Distributor Info</label>
            <input type="text" class="form-control" id="distributor_info" name="distributor_info" value="{{ product.distributor_info }}">
        </div>
        <div class="form-group mb-3">
            <label for="image" class="text-white">Product Image</label>
            {% if product.image %}
            <div class="mb-2">
                <img src="{{ product.image }}" alt="{{ product.name }}" style="max-width: 200px; max-height: 200px;">
            </div>
            {% endif %}
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
            <small class="form-text text-muted">Supported formats: JPG, JPEG, PNG, GIF (max. 16MB)</small>
        </div>
        <button type="submit" class="btn btn-primary">Update Product</button>
    </form>
</div>
{% endblock %}
