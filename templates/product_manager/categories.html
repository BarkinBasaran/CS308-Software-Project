{% extends "base.html" %}

{% block content %}
<style>
.category-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 1rem; margin-top: 1rem; }
.category-card { background: #222; border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
.category-card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; color: #fff; }
.category-card p { color: #ccc; flex-grow: 1; }
.category-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
.category-actions .btn { flex: 1; }
.add-category-card { background: #222; border: 2px dashed #555; border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; cursor: pointer; transition: background 0.2s, color 0.2s; }
.add-category-card:hover { background: #333; color: #ff5e62; }
.create-form { display: none; background: #222; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
.create-form .form-group { margin-bottom: 1rem; }
.create-form input { width: 100%; padding: 0.6rem; background: #333; border: 1px solid #444; border-radius: 5px; color: #eee; }
.create-form .form-buttons { display: flex; gap: 0.5rem; justify-content: flex-end; }
</style>

<div class="container mt-4">
  <h1>Manage Categories</h1>
  <!-- Add Form -->
  <div class="create-form" id="add-form">
    <h3>Add New Category</h3>
    <div class="form-group">
      <input type="text" id="cat-name" placeholder="Name" required>
    </div>
    <div class="form-group">
      <input type="text" id="cat-desc" placeholder="Description">
    </div>
    <div class="form-buttons">
      <button id="cancel-add" class="btn btn-secondary">Cancel</button>
      <button id="submit-add" class="btn btn-success">Create</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="category-grid">
    <div class="add-category-card" id="show-add-card">
      <ion-icon name="add-circle-outline" style="font-size:2rem;"></ion-icon>
      <span>Add New Category</span>
    </div>
    {% for c in categories %}
    <div class="category-card">
      <h3><ion-icon name="list-outline"></ion-icon>{{ c.name }}</h3>
      <p>{{ c.description }}</p>
      <div class="category-actions">
        <button class="btn btn-sm btn-secondary edit-category" data-id="{{ c.id }}" data-name="{{ c.name }}" data-description="{{ c.description }}"><ion-icon name="pencil-outline"></ion-icon>Edit</button>
        <button class="btn btn-sm btn-danger delete-category" data-id="{{ c.id }}"><ion-icon name="trash-outline"></ion-icon>Delete</button>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Toggle add form
const showAdd = document.getElementById('show-add-card');
const addForm = document.getElementById('add-form');
const cancelAdd = document.getElementById('cancel-add');
showAdd.addEventListener('click', () => { addForm.style.display = 'block'; showAdd.style.display = 'none'; });
cancelAdd.addEventListener('click', () => { addForm.style.display = 'none'; showAdd.style.display = 'flex'; });

// Create category
document.getElementById('submit-add').addEventListener('click', () => {
  const name = document.getElementById('cat-name').value;
  const desc = document.getElementById('cat-desc').value;
  if (!name) return alert('Name is required');
  fetch('/api/categories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, description: desc })
  }).then(res => res.json()).then(data => {
    if (!data.success) alert(data.error || 'Error creating category');
    else location.reload();
  }).catch(err => { console.error(err); alert('An error occurred'); });
});

// Edit category
document.querySelectorAll('.edit-category').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.id;
    const name = prompt('Name', btn.dataset.name);
    const description = prompt('Description', btn.dataset.description);
    if (name !== null) {
      fetch(`/api/categories/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description })
      }).then(res => res.json()).then(data => {
        if (!data.success) alert(data.error || 'Error updating category');
        else location.reload();
      });
    }
  });
});

// Delete category
document.querySelectorAll('.delete-category').forEach(btn => {
  btn.addEventListener('click', () => {
    if (confirm('Are you sure you want to delete this category?')) {
      fetch(`/api/categories/${btn.dataset.id}`, { method: 'DELETE' })
        .then(res => res.json()).then(data => {
          if (!data.success) alert(data.error || 'Error deleting category');
          else location.reload();
        });
    }
  });
});
</script>
{% endblock %}
