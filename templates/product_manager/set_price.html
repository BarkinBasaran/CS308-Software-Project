{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h1>Set Product Price</h1>
  <div class="row">
    <div class="col-md-6">
      <div class="card bg-dark text-light">
        <div class="card-header">
          <h5 class="mb-0">Product Details</h5>
        </div>
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">Current Price: ${{ '%.2f'|format(product.price) }}</p>
          <form method="POST">
            <div class="form-group">
              <label for="price">New Price ($)</label>
              <input type="number" step="0.01" class="form-control bg-dark text-light" id="price" name="price" required>
            </div>
            <button type="submit" class="btn btn-success mt-3">Update Price</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
