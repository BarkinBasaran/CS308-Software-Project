{% extends "base.html" %}

{% block content %}
<style>
.link-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 1rem; margin-top: 2rem; }
.link-card { background: #222; border-radius: 8px; padding: 1.5rem; text-align: center; transition: background 0.2s; cursor: pointer; }
.link-card:hover { background: #333; }
.link-card a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ff5e62; font-weight: 500; text-decoration: none; gap: 0.5rem; }
.link-card ion-icon { font-size: 2rem; }
</style>

<div class="container mt-4">
  <h1>Product Manager Panel</h1>
  <div class="link-grid">
    <div class="link-card">
      <a href="{{ url_for('product_manager.manage_products') }}">
        <ion-icon name="pricetag-outline"></ion-icon>
        <span>Manage Products</span>
      </a>
    </div>

    <div class="link-card">
      <a href="{{ url_for('product_manager.manage_categories') }}">
        <ion-icon name="list-outline"></ion-icon>
        <span>Manage Categories</span>
      </a>
    </div>

    <div class="link-card">
      <a href="{{ url_for('product_manager.manage_comments') }}">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <span>Approve/Reject Comments</span>
      </a>
    </div>

    <div class="link-card">
      <a href="{{ url_for('product_manager.manage_deliveries') }}">
        <ion-icon name="car-outline"></ion-icon>
        <span>View & Update Deliveries</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
