<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    /* Genel stil */
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
    }

    /* Form kabı */
    .center-container {
      width: 400px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    /* Logo - Tıklanabilir */
    .logo-area {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-link {
      text-decoration: none;
    }
    .logo-text {
      font-size: 2rem;
      font-weight: 700;
      color: #e94057;
      transition: transform 0.3s ease-in-out;
    }
    .logo-text:hover {
      transform: scale(1.1);
    }

    /* Form başlığı */
    .forgot-form h2 {
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
    }

    /* Giriş alanları */
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
    }

    /* Hata mesajları */
    .error {
      color: #ff4444;
      font-size: 0.85rem;
      margin-bottom: 10px;
      text-align: center;
    }

    /* Şifre sıfırlama butonu */
    .btn-forgot {
      width: 100%;
      padding: 12px;
      background: #e94057;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .btn-forgot:hover {
      transform: scale(1.05);
    }

    /* Girişe geri dön butonu */
    .back-btn {
      display: block;
      margin: 10px 0;
      font-size: 0.9rem;
      text-decoration: none;
      color: #0074D9;
      font-weight: 500;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Şifre Sıfırlama Formu -->
  <div class="center-container">
    <div class="logo-area">
      <a href="home" class="logo-link">
        <div class="logo-text">ChipMaster</div>
      </a>
    </div>

    <form id="forgotForm" class="forgot-form" method="POST">
      <h2>Forgot Password</h2>

      <!-- Email Girişi -->
      <div class="input-group">
        <label for="forgot-email">Enter your email</label>
        <input type="email" id="forgot-email" name="forgot-email" placeholder="example@mail.com" required>
      </div>

      <!-- Hata mesajları -->
      <div class="error" id="forgotError"></div>

      <button type="submit" class="btn-forgot">Reset Password</button>
      <a href="login" class="back-btn">Back to Log In</a>
    </form>
  </div>

  <!-- JavaScript Kısmı -->
  <script>
    // Şifre sıfırlama form submission
    const forgotForm = document.getElementById('forgotForm');
    const forgotError = document.getElementById('forgotError');

    forgotForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('forgot-email').value.trim();
      const formData = new FormData(forgotForm);

      try {
        const response = await fetch('/forgotpassword', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const errorData = await response.json();
          forgotError.textContent = errorData.message || 'Password reset failed.';
          return;
        }

        alert('If the email exists, password reset instructions will be sent.');
        window.location.href = '/login';
      } catch (error) {
        console.error('Error:', error);
        forgotError.textContent = 'An error occurred while connecting to the server.';
      }
    });
  </script>

</body>
</html>
