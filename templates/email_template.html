<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Your Password - ChipMaster</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000; /* Arkaplan tamamen siyah */
      margin: 0;
      padding: 0;
      text-align: center;
      color: #ddd; /* Açık gri metin */
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #111; /* Hafif koyu siyah form kutusu */
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ff5e62;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.6rem;
      color: #fff; /* Beyaz başlık */
      margin-bottom: 10px;
    }
    p {
      font-size: 1rem;
      color: #bbb; /* Açık gri metin */
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      margin: 20px 0;
      background: #ff5e62;
      color: white !important; /* E-posta istemcilerinde yazıyı beyaz yap */
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.3s ease-in-out;
    }
    .btn:hover {
      background: #e94057;
      color: white !important; /* Hover olduğunda da beyaz kalsın */
    }
    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ChipMaster Logo -->
    <div class="logo">ChipMaster</div>

    <!-- Main Content -->
    <h1>Reset Your Password</h1>
    <p>We received a request to reset your password. Click the button below to set a new password.</p>

    <!-- Reset Password Button -->
    <a href="{{ reset_url }}" class="btn" style="color: white !important;">Reset Password</a>

    <p>If you did not request this, you can safely ignore this email.</p>

    <!-- Footer -->
    <div class="footer">
      <p>&copy; 2025 ChipMaster. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
