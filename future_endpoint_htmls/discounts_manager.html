  <script>
    const API = '/api/discounts';

    async function loadDiscounts() {
      const res = await fetch(API);
      if (!res.ok) return console.error(await res.text());
      const data = await res.json();
      const tbody = document.querySelector('#discountsTable tbody');
      tbody.innerHTML = '';
      data.forEach(disc => {
        const tr = document.createElement('tr');
        tr.innerHTML = \`
          <td>\${disc.id}</td>
          <td>\${disc.code}</td>
          <td>\${disc.percent}</td>
          <td class="text-center">

          </td>\`;

      });

    async function deleteDiscount(id) {
      const res = await fetch(\`\${API}/\${id}\`, { method: 'DELETE' });
      if (res.ok) loadDiscounts();
    }

    document.getElementById('addDiscountForm').addEventListener('submit', async e => {
      e.preventDefault();
      const code    = document.getElementById('discCode').value.trim();
      const percent = parseFloat(document.getElementById('discPercent').value);
      if (!code || isNaN(percent)) return;
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, percent })
      });
      if (res.ok) {
        e.target.reset();
        loadDiscounts();
      }
    });

    // Initial load
    loadDiscounts();
  </script>
